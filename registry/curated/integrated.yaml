# 已接入并通过真实联网采集的来源（C2）
# 全部为官方、免费、无需登录的公开接口。verification.evidence_ref 指向本轮探测记录。
sources:
  - id: hacker-news
    name: Hacker News
    category: technology
    tags: [news, startup, programming]
    provider_url: https://news.ycombinator.com/
    docs_url: https://github.com/HackerNews/API
    access:
      type: rest_json
      base_url: https://hacker-news.firebaseio.com/v0
      auth: none
      cost_tier: F0
      quota: 无公开硬配额，建议 >= 1 秒/请求
      quota_verified_at: "2026-11-16"
    collector:
      adapter: hackernews
      default_interval_minutes: 120
      max_items_per_run: 20
      params:
        story_type: topstories
    rights:
      metadata: allowed
      fulltext: prohibited_by_default
      download: prohibited_by_default
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://news.ycombinator.com/legal
    verification:
      status: integrated
      docs_checked_at: "2026-11-16"
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: arxiv-cs-ai
    name: arXiv cs.AI 最新论文
    category: academic
    tags: [paper, ai, preprint]
    provider_url: https://arxiv.org/list/cs.AI/recent
    docs_url: https://info.arxiv.org/help/api/index.html
    access:
      type: rss_atom
      base_url: https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=20
      auth: none
      cost_tier: F0
      quota: 建议 <= 1 请求 / 3 秒
      quota_verified_at: "2026-11-16"
    collector:
      adapter: rss
      default_interval_minutes: 720
      max_items_per_run: 20
    rights:
      metadata: allowed
      fulltext: review_required
      download: review_required
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://info.arxiv.org/help/api/tou.html
    verification:
      status: integrated
      docs_checked_at: "2026-11-16"
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: sspai
    name: 少数派
    category: media
    tags: [中文, 效率, 数码]
    provider_url: https://sspai.com/
    docs_url: https://sspai.com/feed
    access: {type: rss_atom, base_url: https://sspai.com/feed, auth: none, cost_tier: F0}
    collector: {adapter: rss, default_interval_minutes: 360, max_items_per_run: 20}
    rights:
      metadata: allowed
      fulltext: prohibited_by_default
      download: prohibited_by_default
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://sspai.com/page/agreement
    verification:
