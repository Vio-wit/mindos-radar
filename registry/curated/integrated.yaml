  - id: openalex-works
    name: OpenAlex 学术作品
    category: academic
    tags: [paper, open-data, citation]
    provider_url: https://openalex.org/
    docs_url: https://docs.openalex.org/
    access:
      type: rest_json
      base_url: https://api.openalex.org/works?per-page=20&sort=publication_date:desc
      auth: none
      cost_tier: F0
      quota: 10 请求/秒，建议 1 请求/秒
      quota_verified_at: "2026-11-16"
    collector:
      adapter: jsonmap
      default_interval_minutes: 720
      max_items_per_run: 20
      params:
        url: https://api.openalex.org/works?per-page=20&sort=publication_date:desc
        items_path: results
        fields:
          external_id: id
          title: [display_name, title]
          url: doi
          published_at: publication_date
          author: authorships[0].author.display_name
          summary: [primary_location.source.display_name]
    rights:
      metadata: allowed
      fulltext: review_required
      download: prohibited_by_default
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://docs.openalex.org/how-to-use-the-api/api-overview
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: gutendex-popular
    name: Gutendex 热门公版书
    category: books
    tags: [ebook, public-domain, gutenberg]
    provider_url: https://gutendex.com/
    docs_url: https://gutendex.com/
    access: {type: rest_json, base_url: https://gutendex.com/books, auth: none, cost_tier: F0}
    collector:
      adapter: jsonmap
      default_interval_minutes: 1440
      max_items_per_run: 20
      params:
        url: https://gutendex.com/books?sort=popular
        items_path: results
        fields:
          external_id: id
          title: title
          url: id
          url_template: https://www.gutenberg.org/ebooks/{value}
          author: authors[0].name
          summary: subjects
        kind: book
    rights:
      metadata: allowed
      fulltext: allowed
      download: allowed
      redistribution: allowed
      commercial_use: allowed
      policy_url: https://www.gutenberg.org/policy/permission.html
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: github-releases
    name: GitHub Releases 追踪
    category: opensource
    tags: [release, changelog, github]
    provider_url: https://github.com/
    docs_url: https://docs.github.com/en/rest/releases/releases
    access:
      type: rest_json
      base_url: https://api.github.com
      auth: none
      secret_ref: github_token
      cost_tier: F1
      quota: 未认证 60 请求/小时；认证 5000 请求/小时
      quota_verified_at: "2026-11-16"
    collector:
      adapter: github_releases
      default_interval_minutes: 720
      max_items_per_run: 15
      params:
        repos: [microsoft/vscode, openai/openai-python, python/cpython]
        per_page: 5
    rights:
      metadata: allowed
      fulltext: allowed
      download: prohibited_by_default
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: open-meteo-suzhou
    name: Open-Meteo 苏州天气
    category: weather
    tags: [weather, forecast, no-key]
    provider_url: https://open-meteo.com/
    docs_url: https://open-meteo.com/en/docs
    access: {type: rest_json, base_url: https://api.open-meteo.com/v1/forecast, auth: none, cost_tier: F0}
    collector:
      adapter: openmeteo
      default_interval_minutes: 180
      max_items_per_run: 1
      params:
        latitude: 31.30
        longitude: 120.62
        hourly: [temperature_2m, relative_humidity_2m, precipitation, wind_speed_10m]
        forecast_days: 3
    rights:
      metadata: allowed
      fulltext: allowed
      download: allowed
      redistribution: allowed
      commercial_use: allowed
      policy_url: https://open-meteo.com/en/license
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: crossref-works
    name: Crossref 最新 DOI
    category: academic
    tags: [doi, metadata, publishing]
    provider_url: https://www.crossref.org/
    docs_url: https://api.crossref.org/swagger-ui/index.html
    access:
      type: rest_json
      base_url: https://api.crossref.org/works?rows=15&sort=published&order=desc
      auth: none
      cost_tier: F0
      quota: polite pool：带 mailto 更快；未声明时仍可用
      quota_verified_at: "2026-11-16"
    collector:
      adapter: jsonmap
      default_interval_minutes: 720
      max_items_per_run: 15
      params:
        url: https://api.crossref.org/works?rows=15&sort=published&order=desc
        items_path: message.items
        date_parts: true
        fields:
          external_id: DOI
          title: title
          url: URL
          published_at: published.date-parts
          author: author[0].family
          summary: container-title
    rights:
      metadata: allowed
      fulltext: prohibited_by_default
      download: prohibited_by_default
      redistribution: review_required
      commercial_use: unknown
      policy_url: https://www.crossref.org/operations-and-sustainability/access-and-distribution/
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

  - id: nvd-recent
    name: NVD 最新 CVE
    category: security
    tags: [cve, vulnerability, nist]
    provider_url: https://nvd.nist.gov/
    docs_url: https://nvd.nist.gov/developers/vulnerabilities
    access:
      type: rest_json
      base_url: https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=20
      auth: none
      cost_tier: F0
      quota: 无 Key 5 请求/30 秒
      quota_verified_at: "2026-11-16"
    collector:
      adapter: jsonmap
      default_interval_minutes: 720
      max_items_per_run: 20
      params:
        url: https://services.nvd.nist.gov/rest/json/cves/2.0?resultsPerPage=20
        items_path: vulnerabilities
        fields:
          external_id: cve.id
          title: cve.descriptions[0].value
          url: cve.id
          url_template: https://nvd.nist.gov/vuln/detail/{value}
          published_at: cve.published
          summary: cve.descriptions[1].value
        kind: advisory
    rights:
      metadata: allowed
      fulltext: prohibited_by_default
      download: prohibited_by_default
      redistribution: allowed
      commercial_use: allowed
      policy_url: https://www.nist.gov/open/copyright-fair-use-and-licensing-statements-srd-data-software-and-technical-series-publications
    verification:
      status: integrated
      live_checked_at: "2026-11-16"
      evidence_ref: docs/evidence/SRC-probe-2026-11-16.json
    origin: {type: curated}

